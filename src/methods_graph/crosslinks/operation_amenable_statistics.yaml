  - {operation: "op:operation_3767", statistical_method: "stat:target_decoy_fdr", label: "Target-decoy false-discovery-rate / q-value estimation", evidence: {doi: "10.1038/nmeth1019"}, note: "Protein-identification confidence via target-decoy FDR / q-value."}
