  # ===================================================================
  - {operation: "op:operation_3223", statistical_method: "obo:STATO_0000559", label: "Wald test", evidence: {doi: "10.1186/s13059-014-0550-8"}, note: "Per-gene DE significance via the negative-binomial GLM Wald test (DESeq2)."}
