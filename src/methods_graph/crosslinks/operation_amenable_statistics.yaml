  # methodological preconditions (raw counts, adaptive QC, count-appropriate normalization,
  # cluster stability) — and explicitly NOT to a bulk per-group replicate floor.
  - {operation: "op:operation_0313", statistical_method: "stat:sc_clustering_workflow", label: "Single-cell unsupervised clustering workflow", evidence: {doi: "10.15252/msb.20188746"}, note: "Single-cell preprocessing->clustering evaluability (Luecken & Theis tutorial); unsupervised, no replicate floor."}
