  - {operation: "op:operation_2436", statistical_method: "stat:gsea_enrichment", label: "GSEA weighted running-sum enrichment score", evidence: {doi: "10.1073/pnas.0506580102"}, note: "Weighted KS-like running-sum enrichment statistic with a phenotype-permutation null (GSEA) — curated node, not the standard KS test."}
  # GSEA's FDR q-value comes from a PERMUTATION empirical-null over the pooled NES
  # distribution, not the Benjamini-Hochberg sequential-p-value procedure — so it maps
  # to the GENERIC FDR node, not the BH node (cf. DESeq2/edgeR/limma which do use BH).
  - {operation: "op:operation_2436", statistical_method: "obo:OBI_0200163", label: "false discovery rate correction method", evidence: {doi: "10.1073/pnas.0506580102"}, note: "Permutation-based empirical-null FDR q-value across gene sets (GSEA)."}

  - {operation: "op:operation_2495", statistical_method: "obo:STATO_0000559", label: "Wald test", evidence: {doi: "10.1186/s13059-014-0550-8"}, note: "Per-gene DE significance on the expression matrix (DESeq2)."}
  - {operation: "op:operation_2495", statistical_method: "obo:OBI_0200036", label: "Benjamini and Hochberg false discovery rate correction method", evidence: {doi: "10.1111/j.2517-6161.1995.tb02031.x"}, note: "Multiple-testing correction across genes."}

