  assumption: assum:continuous_distribution
  evidence: doi:10.1073/pnas.0506580102
  source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1239896/
  note: The weighted running-sum enrichment statistic assumes a continuous gene-level ranking metric;
    heavy ties distort the running sum and its permutation null.
