- statistical_method: stat:gsea_enrichment
  assumption: assum:sample_exchangeability
  evidence: doi:10.1073/pnas.0506580102
  source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1239896/
  note: GSEA's significance comes from a phenotype-permutation null, which assumes sample labels are
    exchangeable under the null — NOT that genes are independent (sample permutation preserves gene-gene
    correlation, which is why GSEA does not carry the standard KS i.i.d. assumption).
  confidence: high
