  confidence: high
- statistical_method: obo:OBI_0200036
  assumption: assum:independence_or_prds
  evidence: doi:10.1214/aos/1013699998
  source_url: https://projecteuclid.org/journals/annals-of-statistics/volume-29/issue-4/The-control-of-the-false-discovery-rate-in-multiple-testing/10.1214/aos/1013699998.full
  note: The Benjamini-Hochberg FDR procedure controls FDR under independence or positive regression dependence
