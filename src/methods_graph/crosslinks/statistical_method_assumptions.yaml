# Curated, grounded statistical-method assumptions (StatisticalMethod -> Assumption).
#
# STATO describes assumptions only in free-text definitions (no Assumption classes,
# no has_assumption relation), so they cannot be harvested and are authored here as
# grounded claims. Each 'requires' edge cites an authoritative source (evidence token:
# doi:|pmid:|url:|isbn:|stato:), and was verified against the literature and survived
# an adversarial refutation pass. Assumptions attach to the statistical METHOD; a
# Method inherits them via USES_STATISTICAL_METHOD.
#
# Enforced downstream: load rejects an ungrounded/unknown-id/duplicate edge; the build
# emits an edge only StatisticalMethod->Assumption (mints the Assumption node); the
# audit fails on any mistyped or evidence-less REQUIRES_ASSUMPTION edge.
version: 1
# Curated StatisticalMethod nodes for statistics that STATO/OBI does NOT model as a
# clean class.  Minted as StatisticalMethod nodes (id 'stat:<slug>') so a method can
# USE / be AMENABLE_TO them and inherit their (correct) assumptions, instead of being
# force-fitted onto a near-but-wrong ontology term whose assumptions would then leak.
statistical_methods:
- id: stat:gsea_enrichment
  name: GSEA weighted running-sum enrichment score
  definition: GSEA's enrichment statistic — a weighted Kolmogorov-Smirnov-like running sum over a ranked
    gene list, with significance from a phenotype-permutation empirical null. Unlike the standard KS test
    it is weighted and does NOT assume i.i.d. genes; the permutation preserves gene-gene correlation.
  reference: doi:10.1073/pnas.0506580102
- id: stat:target_decoy_fdr
  name: Target-decoy false-discovery-rate / q-value estimation
  definition: Estimates the false-discovery rate of peptide/protein identifications by searching
    a decoy database of incorrect sequences; decoy hits estimate the count of incorrect target
    hits above a score threshold, giving a q-value (and, with a mixture model, a posterior error
    probability). Distinct from BH p-value adjustment and from permutation FDR.
  reference: doi:10.1038/nmeth1019
- id: stat:protein_lfq_de
  name: Label-free / quantitative protein differential-abundance test
  definition: Per-protein differential-abundance testing on (log-transformed, normalized) protein
    intensities, typically a moderated/empirical-Bayes linear model (limma-trend) with BH FDR across
    proteins. Distinct from the RNA-seq count models; carries proteomics-specific assumptions
    (abundance-dependent missingness, quantification linearity, peptide support per protein).
  reference: doi:10.1016/j.euprot.2015.02.002
- id: stat:sc_clustering_workflow
  name: Single-cell unsupervised clustering workflow
  definition: The standard single-cell RNA-seq preprocessing-to-clustering pipeline (QC filtering,
    depth normalization/variance stabilization, highly-variable-gene selection, PCA, neighbor-graph
    construction, and Leiden/Louvain community detection). It is UNSUPERVISED and operates on the
    cell-cell graph of a single dataset, so — unlike bulk negative-binomial DE — it carries NO
    per-group biological-replicate assumption. Its preconditions are about input type (raw UMI
    counts), adaptive quality control, count-appropriate normalization, and cluster stability.
  reference: doi:10.15252/msb.20188746
assumptions:
- id: assum:asymptotic_normality
  name: asymptotic (large-sample) normality
  definition: Inference relies on the large-sample (asymptotic) normal distribution of the estimator or
    test statistic; valid only for sufficiently large samples.
  reference: url:https://www.statlect.com/fundamentals-of-statistics/Wald-test
- id: assum:independence
  name: independence of observations
  definition: The observations (or model errors) are statistically independent of one another.
  reference: url:https://www.itl.nist.gov/div898/handbook/prc/section4/prc422.htm
- id: assum:normality
  name: normality
  definition: The model residuals (or the sampled variable) are drawn from a normal distribution.
  reference: url:https://www.itl.nist.gov/div898/handbook/pmd/section2/pmd214.htm
- id: assum:homoscedasticity
  name: homoscedasticity (homogeneity of variance)
  definition: The error variance (or the variance across compared groups) is constant.
  reference: doi:10.1136/gpsych-2019-100148
- id: assum:linearity
  name: linearity
  definition: The mean response is a linear function of the predictors, or the structure of interest lies
    in linear combinations of the variables.
  reference: url:https://online.stat.psu.edu/stat501/lesson/1/1.3
- id: assum:linearity_of_logit
  name: linearity of the logit
  definition: The log-odds (logit) of the outcome is a linear function of the continuous predictors.
  reference: doi:10.1136/fmch-2021-001290
- id: assum:no_multicollinearity
  name: absence of perfect multicollinearity
  definition: Predictors are not perfectly (or near-perfectly) linearly dependent.
  reference: doi:10.1002/0471722146
- id: assum:continuous_distribution
  name: continuous underlying distribution
  definition: The underlying/reference distribution is continuous (e.g. for the Kolmogorov-Smirnov test).
  reference: url:https://www.itl.nist.gov/div898/handbook/eda/section3/eda35g.htm
- id: assum:fixed_margins
  name: fixed marginal totals
  definition: Inference conditions on fixed marginal totals of the contingency table.
  reference: url:https://stats.libretexts.org/Bookshelves/Introductory_Statistics
- id: assum:correct_model_specification
  name: correct model specification
  definition: The assumed parametric model / likelihood is correctly specified for the data-generating
    process.
  reference: url:https://www.statlect.com/fundamentals-of-statistics/maximum-likelihood
- id: assum:regularity_conditions
  name: regularity conditions
  definition: The likelihood satisfies regularity conditions (differentiability, interior parameter, etc.)
    underpinning MLE's asymptotic properties.
  reference: url:https://www.statlect.com/fundamentals-of-statistics/maximum-likelihood
- id: assum:variance_is_structure
  name: large variance corresponds to structure
  definition: Directions of largest variance are assumed to carry the most informative structure (PCA).
  reference: doi:10.48550/arXiv.1404.1100
- id: assum:independence_or_prds
  name: independence or positive regression dependence (PRDS)
  definition: FDR control holds when the test statistics are independent or satisfy positive regression
    dependence on a subset (PRDS).
  reference: doi:10.1214/aos/1013699998
- id: assum:bivariate_normality
  name: bivariate normality
  definition: For inference on Pearson's correlation, the two variables are assumed to follow a joint
    (bivariate) normal distribution.
  reference: url:https://online.stat.psu.edu/stat500/lesson/9/9.4
- id: assum:monotonic_relationship
  name: monotonic relationship
  definition: The association between the two variables is monotonic (consistently increasing or decreasing),
    the structure a rank correlation such as Spearman's is designed to detect.
  reference: url:https://www.statstutor.ac.uk/resources/uploaded/spearmans.pdf
- id: assum:adequate_expected_cell_counts
  name: adequate expected cell counts
  definition: The chi-square approximation is reliable only when the contingency table's EXPECTED cell
    counts are large enough (Cochran's rule of thumb - all expected counts >=1 and at least 80% >=5);
    below that, use an exact test (e.g. Fisher's).
  reference: url:https://www.itl.nist.gov/div898/handbook/prc/section4/prc45.htm
- id: assum:homogeneity_of_regression_slopes
  name: homogeneity of regression slopes (parallel slopes)
  definition: ANCOVA assumes the slope of the covariate-response relationship is equal across groups
    (no covariate-by-group interaction); a different slope per group invalidates a single adjusted
    comparison.  This is the assumption that distinguishes ANCOVA from ordinary regression/ANOVA.
  reference: url:https://online.stat.psu.edu/stat502/lesson/9
- id: assum:sample_exchangeability
  name: sample exchangeability under the null
  definition: A permutation test assumes the sample labels (e.g. phenotype assignments) are exchangeable
    under the null hypothesis — i.e. samples are independent and identically distributed at the SAMPLE
    level so permuting labels yields a valid null.  Crucially this does NOT require the measured features
    (genes) to be independent; gene-gene correlation is preserved by sample permutation.
  reference: doi:10.1073/pnas.0506580102
- id: assum:decoy_faithfulness
  name: decoy faithfully models the incorrect-match score distribution
  definition: The decoy database produces matches whose score distribution faithfully represents
    that of incorrect (random) target matches; if it does not, the target-decoy FDR/q-value is
    mis-estimated.
  reference: doi:10.1038/nmeth1019
- id: assum:equal_chance_random_match
  name: equal probability of a random match to target or decoy
  definition: A spectrum that does not arise from a database peptide is equally likely to match a
    target or a decoy entry; this symmetry is what lets decoy counts estimate target false positives.
  reference: doi:10.1038/nmeth1019
- id: assum:missing_not_at_random
  name: missingness mechanism is correctly handled (MNAR vs MCAR)
  definition: Missing intensities in label-free proteomics are often abundance-dependent
    (left-censored, MNAR); naive complete-case analysis or mean imputation biases differential
    abundance unless the missingness mechanism is modeled.
  reference: doi:10.1021/acs.jproteome.5b00981
- id: assum:quantification_linearity
  name: measured intensity is linear in true abundance
  definition: The reported intensity is approximately linear in true protein abundance over the
    measured range; severe ratio compression (common in DIA/isobaric workflows) attenuates
    fold-changes and biases the test.
  reference: doi:10.1016/j.euprot.2015.02.002
- id: assum:sufficient_peptides_per_protein
  name: sufficient peptide support per protein
  definition: Protein-level inference assumes enough quantified peptides per protein for a stable
    roll-up; single-peptide proteins give high-variance, unreliable abundance estimates.
  reference: doi:10.1016/j.euprot.2015.02.002
# ---- single-cell unsupervised clustering (stat:sc_clustering_workflow) ----
- id: assum:raw_umi_counts_input
  name: input is raw UMI counts
  definition: The preprocessing/clustering pipeline assumes its input is the raw integer
    UMI count matrix (not pre-normalized or log-transformed values); normalization and
    variance stabilization must be applied within the workflow, not upstream.
  reference: doi:10.15252/msb.20188746
- id: assum:adaptive_qc_filtering
  name: low-quality cells removed by adaptive (MAD) thresholds
  definition: Empty droplets, dying cells, and doublets are removed using adaptive thresholds
    (median ± k MAD on QC metrics) rather than fixed univariate cutoffs, which bias against
    small or low-RNA-content cell populations.
  reference: doi:10.1038/s41576-023-00586-w
- id: assum:normalization_appropriate_for_counts
  name: normalization is appropriate for count data
  definition: Depth/library-size normalization and variance stabilization suited to UMI count
    data are applied (e.g. shifted-log of size-factor-normalized counts, or analytic Pearson
    residuals); the transform should stabilize the mean-variance relationship of the counts.
  reference: doi:10.1186/s13059-021-02451-7
- id: assum:hvg_captures_biological_variation
  name: selected features capture biological variation
  definition: Highly-variable-gene selection assumes the chosen features reflect biological
    heterogeneity rather than purely technical noise, as judged against the fitted
    mean-variance (dispersion) trend.
  reference: doi:10.15252/msb.20188746
- id: assum:clustering_unsupervised_no_replicate_floor
  name: clustering is unsupervised with no per-group replicate requirement
  definition: Community-detection clustering (Leiden/Louvain) is an unsupervised procedure on a
    single dataset's cell-cell neighbor graph (OSCA, doi:10.1038/s41592-019-0654-x); it imposes NO
    biological-replicate floor. A per-group replicate requirement is a property of cross-condition
    (pseudobulk) differential expression at the SAMPLE level — where treating cells as replicates
    inflates false discoveries (Squair et al. 2021) — never of clustering.
  reference: doi:10.1038/s41467-021-25960-2
- id: assum:cluster_resolution_stability
  name: reported clusters are stable across resolution
  definition: The reported clustering is not an artifact of an arbitrary resolution; clusters
    should be stable under resolution perturbation / subsampling and separable on the embedding
    (not over- or under-clustered).
  reference: doi:10.15252/msb.20188746
