  assumption: assum:correct_model_specification
  evidence: doi:10.1073/pnas.1530509100
  source_url: https://www.pnas.org/doi/10.1073/pnas.1530509100
  note: FDR control requires the null distribution of the scores/test-statistics to be correctly
    characterized; a mis-specified null (invalid p-values, an unfaithful decoy, or a wrong permutation
    scheme) breaks the q-value calibration.
