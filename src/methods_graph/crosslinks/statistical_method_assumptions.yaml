# Curated, grounded statistical-method assumptions (StatisticalMethod -> Assumption).
#
# STATO describes assumptions only in free-text definitions (no Assumption classes,
# no has_assumption relation), so they cannot be harvested and are authored here as
# grounded claims. Each 'requires' edge cites an authoritative source (evidence token:
# doi:|pmid:|url:|isbn:|stato:), and was verified against the literature and survived
# an adversarial refutation pass. Assumptions attach to the statistical METHOD; a
# Method inherits them via USES_STATISTICAL_METHOD.
#
# Enforced downstream: load rejects an ungrounded/unknown-id/duplicate edge; the build
# emits an edge only StatisticalMethod->Assumption (mints the Assumption node); the
# audit fails on any mistyped or evidence-less REQUIRES_ASSUMPTION edge.
version: 1
assumptions:
- id: assum:asymptotic_normality
  name: asymptotic (large-sample) normality
  definition: Inference relies on the large-sample (asymptotic) normal distribution of the estimator or
    test statistic; valid only for sufficiently large samples.
  reference: url:https://www.statlect.com/fundamentals-of-statistics/Wald-test
- id: assum:independence
  name: independence of observations
  definition: The observations (or model errors) are statistically independent of one another.
  reference: url:https://www.itl.nist.gov/div898/handbook/prc/section4/prc422.htm
- id: assum:normality
  name: normality
  definition: The model residuals (or the sampled variable) are drawn from a normal distribution.
  reference: url:https://www.itl.nist.gov/div898/handbook/pmd/section2/pmd214.htm
- id: assum:homoscedasticity
  name: homoscedasticity (homogeneity of variance)
  definition: The error variance (or the variance across compared groups) is constant.
  reference: doi:10.1136/gpsych-2019-100148
- id: assum:linearity
  name: linearity
  definition: The mean response is a linear function of the predictors, or the structure of interest lies
    in linear combinations of the variables.
  reference: url:https://online.stat.psu.edu/stat501/lesson/1/1.3
- id: assum:linearity_of_logit
  name: linearity of the logit
  definition: The log-odds (logit) of the outcome is a linear function of the continuous predictors.
  reference: doi:10.1136/fmch-2021-001290
- id: assum:no_multicollinearity
  name: absence of perfect multicollinearity
  definition: Predictors are not perfectly (or near-perfectly) linearly dependent.
  reference: doi:10.1002/0471722146
- id: assum:continuous_distribution
  name: continuous underlying distribution
  definition: The underlying/reference distribution is continuous (e.g. for the Kolmogorov-Smirnov test).
  reference: url:https://www.itl.nist.gov/div898/handbook/eda/section3/eda35g.htm
- id: assum:fixed_margins
  name: fixed marginal totals
  definition: Inference conditions on fixed marginal totals of the contingency table.
  reference: url:https://stats.libretexts.org/Bookshelves/Introductory_Statistics
- id: assum:correct_model_specification
  name: correct model specification
  definition: The assumed parametric model / likelihood is correctly specified for the data-generating
    process.
  reference: url:https://www.statlect.com/fundamentals-of-statistics/maximum-likelihood
- id: assum:regularity_conditions
  name: regularity conditions
  definition: The likelihood satisfies regularity conditions (differentiability, interior parameter, etc.)
    underpinning MLE's asymptotic properties.
  reference: url:https://www.statlect.com/fundamentals-of-statistics/maximum-likelihood
- id: assum:variance_is_structure
  name: large variance corresponds to structure
  definition: Directions of largest variance are assumed to carry the most informative structure (PCA).
  reference: doi:10.48550/arXiv.1404.1100
- id: assum:independence_or_prds
  name: independence or positive regression dependence (PRDS)
  definition: FDR control holds when the test statistics are independent or satisfy positive regression
    dependence on a subset (PRDS).
  reference: doi:10.1214/aos/1013699998
requires:
- statistical_method: obo:STATO_0000559
  assumption: assum:asymptotic_normality
  evidence: url:https://www.statlect.com/fundamentals-of-statistics/Wald-test
  source_url: https://www.statlect.com/fundamentals-of-statistics/Wald-test
  note: 'The Wald test relies on the asymptotic normality of the maximum-likelihood estimator: the statistic
    is compared to a normal/chi-square distribution, valid only in large samples.'
  confidence: high
- statistical_method: obo:STATO_0000559
  assumption: assum:independence
  evidence: url:https://www.statlect.com/fundamentals-of-statistics/maximum-likelihood
  source_url: https://www.statlect.com/fundamentals-of-statistics/Wald-test
  note: The Wald test assumes the observations are independent.
  confidence: high
- statistical_method: obo:STATO_0000086
  assumption: assum:normality
  evidence: url:https://www.itl.nist.gov/div898/handbook/pmd/section2/pmd214.htm
  source_url: https://www.itl.nist.gov/div898/handbook/pmd/section2/pmd214.htm
  note: The classical F-test (ANOVA / linear model) assumes the residuals are normally distributed.
  confidence: high
- statistical_method: obo:STATO_0000086
  assumption: assum:homoscedasticity
  evidence: url:https://en.wikipedia.org/wiki/F-test
  source_url: https://en.wikipedia.org/wiki/F-test
  note: The F-test assumes homogeneity of variance (equal variances across groups).
  confidence: high
- statistical_method: obo:STATO_0000086
  assumption: assum:independence
  evidence: url:https://www.itl.nist.gov/div898/handbook/prc/section4/prc422.htm
  source_url: https://www.itl.nist.gov/div898/handbook/prc/section4/prc422.htm
  note: The F-test assumes the observations/residuals are independent.
  confidence: high
- statistical_method: obo:STATO_0000108
  assumption: assum:linearity
  evidence: url:https://online.stat.psu.edu/stat501/lesson/1/1.3
  source_url: https://online.stat.psu.edu/stat501/lesson/1/1.3
  note: Linear regression assumes the relationship between predictors and the mean response is linear.
  confidence: high
- statistical_method: obo:STATO_0000108
  assumption: assum:independence
  evidence: url:https://online.stat.psu.edu/stat501/lesson/4
  source_url: https://online.stat.psu.edu/stat501/lesson/4
  note: Linear regression assumes the errors are independent.
  confidence: high
- statistical_method: obo:STATO_0000108
  assumption: assum:homoscedasticity
  evidence: doi:10.1136/gpsych-2019-100148
  source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6802968/
  note: Linear regression assumes constant error variance (homoscedasticity).
  confidence: high
- statistical_method: obo:STATO_0000108
  assumption: assum:normality
  evidence: url:https://www.itl.nist.gov/div898/handbook/pmd/section2/pmd214.htm
  source_url: https://www.itl.nist.gov/div898/handbook/pmd/section2/pmd214.htm
  note: Linear regression inference assumes the errors are normally distributed.
  confidence: high
- statistical_method: obo:STATO_0000149
  assumption: assum:independence
  evidence: url:https://www.statology.org/assumptions-of-logistic-regression/
  source_url: https://www.statology.org/assumptions-of-logistic-regression/
  note: Logistic regression assumes the observations are independent.
  confidence: high
- statistical_method: obo:STATO_0000149
  assumption: assum:linearity_of_logit
  evidence: doi:10.1136/fmch-2021-001290
  source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8710907/
  note: Logistic regression assumes linearity between continuous predictors and the log-odds (logit) of
    the outcome.
  confidence: high
- statistical_method: obo:STATO_0000149
  assumption: assum:no_multicollinearity
  evidence: doi:10.1002/0471722146
  source_url: https://doi.org/10.1002/0471722146
  note: Logistic regression assumes the absence of perfect multicollinearity among predictors.
  confidence: high
- statistical_method: obo:STATO_0000083
  assumption: assum:continuous_distribution
  evidence: url:https://www.itl.nist.gov/div898/handbook/prc/section2/prc212.htm
  source_url: https://www.itl.nist.gov/div898/handbook/prc/section2/prc212.htm
  note: The Kolmogorov-Smirnov test assumes the underlying distribution is continuous.
  confidence: high
- statistical_method: obo:STATO_0000083
  assumption: assum:independence
  evidence: url:https://online.stat.psu.edu/stat415/lesson/22/22.1
  source_url: https://online.stat.psu.edu/stat415/lesson/22/22.1
  note: The KS test assumes the observations are independent and identically distributed.
  confidence: high
- statistical_method: obo:STATO_0000073
  assumption: assum:independence
  evidence: isbn:9781481417686
  source_url: http://www.biostathandbook.com/fishers.html
  note: Fisher's exact test assumes the observations are independent.
  confidence: high
- statistical_method: obo:STATO_0000073
  assumption: assum:fixed_margins
  evidence: url:https://stats.libretexts.org/Bookshelves/Applied_Statistics/Biological_Statistics_(McDonald)/02:_Tests_for_Nominal_Variables/2.07:_Fisher's_Exact_Test
  source_url: https://stats.libretexts.org/Bookshelves/Applied_Statistics/Biological_Statistics_(McDonald)/02:_Tests_for_Nominal_Variables/2.07:_Fisher's_Exact_Test
  note: Fisher's exact test conditions on fixed marginal totals of the contingency table.
  confidence: high
- statistical_method: obo:OBI_0200051
  assumption: assum:linearity
  evidence: doi:10.48550/arXiv.1404.1100
  source_url: https://arxiv.org/abs/1404.1100
  note: PCA assumes the structure of interest is captured by linear combinations of the variables.
  confidence: high
- statistical_method: obo:OBI_0200051
  assumption: assum:variance_is_structure
  evidence: url:https://arxiv.org/abs/1404.1100
  source_url: https://arxiv.org/abs/1404.1100
  note: PCA assumes that directions of largest variance carry the most informative structure.
  confidence: high
- statistical_method: obo:STATO_0000428
  assumption: assum:correct_model_specification
  evidence: url:https://www.statlect.com/fundamentals-of-statistics/maximum-likelihood
  source_url: https://www.statlect.com/fundamentals-of-statistics/maximum-likelihood
  note: Maximum likelihood estimation assumes the parametric model (likelihood) is correctly specified.
  confidence: high
- statistical_method: obo:STATO_0000428
  assumption: assum:independence
  evidence: url:https://web.stanford.edu/class/archive/cs/cs109/cs109.1208/lectureNotes/LN20_parameters_mle.pdf
  source_url: https://web.stanford.edu/class/archive/cs/cs109/cs109.1208/lectureNotes/LN20_parameters_mle.pdf
  note: Standard maximum likelihood estimation assumes the observations are independent (iid).
  confidence: high
- statistical_method: obo:STATO_0000428
  assumption: assum:regularity_conditions
  evidence: url:https://www.statlect.com/fundamentals-of-statistics/maximum-likelihood
  source_url: https://www.statlect.com/fundamentals-of-statistics/maximum-likelihood
  note: MLE's asymptotic properties (consistency, asymptotic normality) rely on regularity conditions
