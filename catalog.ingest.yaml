# Full nf-core catalog ingest manifest — reproducible one-command build.
#
#   mg fetch  --dest snapshots           # shared sources (EDAM/biotools/biocontainers/STATO/OBI)
#   mg ingest --manifest catalog.ingest.yaml --dest .work --db data/catalog.kuzu
#
# wiring: false  => registry + execution-specs + modality only (no per-pipeline
# Nextflow DAG, no io_inferred wiring). Each pipeline still contributes its tools,
# pinned containers/commands/typed-I/O, and modality. Deep semantic layers
# (EDAM operations, data-types, assumptions, diagnostics) apply where curated.

snapshot_dir: snapshots
wiring: false
sources:
