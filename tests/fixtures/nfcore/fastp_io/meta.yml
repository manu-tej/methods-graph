name: fastp_io
description: Fast all-in-one preprocessing for FastQ files
tools:
  - fastp:
      description: An ultra-fast all-in-one FASTQ preprocessor
      homepage: https://github.com/OpenGene/fastp
      identifier: biotools:fastp
      edam_operations: []
      edam_topics: []
input:
  - - meta:
          type: map
          description: sample info
    - reads:
          type: file
          description: fastq reads
          ontologies:
            - edam: http://edamontology.org/format_1930
output:
  - json:
        type: file
        description: report
        ontologies:
          - edam: http://edamontology.org/format_3464
