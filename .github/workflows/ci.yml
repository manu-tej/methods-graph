name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # weekly Monday 06:00 UTC — runs the full reproducibility gate

jobs:
  # Fast PR gate: tests + lock-schema validity. DB-gated tests skip gracefully when the
  # (gitignored) data/methods.kuzu artifact is absent, which it is on a fresh checkout.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev]
      - name: Pytest
        run: python -m pytest -q

  # Weekly rebuild job. Two questions, deliberately separated, because only one of them is
  # currently answerable and conflating them left this job red for six weeks with nobody
  # able to act on it:
  #
  #   1. Did upstream drift?  INFORMATIONAL. `fetch` clones nf-core/modules at master HEAD
  #      (fetch_nfcore takes no ref) and queries the BioContainers and bio.tools APIs live,
  #      and neither API is pinned in methods.lock.json at all. The lock RECORDS pins that
  #      nothing replays, so a rebuild diverges from the committed hash the moment upstream
  #      moves. That is a known gap in the fetch layer, not a regression to page someone
  #      about — so it reports rather than fails.
  #
  #   2. Is the build deterministic given identical inputs?  HARD GATE. This one is
  #      genuinely answerable and genuinely valuable: two rebuilds from the same snapshots
  #      must produce the same graph hash. A failure here means real non-determinism in the
  #      connector/resolver/loader chain, which would silently corrupt every lock.
  #
  # Closing gap 1 means threading the lock's pins into `fetch` (a `--nfcore-ref`, plus
  # caching the two API responses). Until then this job answers what it can, honestly.
  #
  # snapshots/ is gitignored and large, so this stays OFF the PR hot path.
  rebuild-verify:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev]
      - name: Fetch sources
        run: python -m methods_graph.cli fetch --dest snapshots

      # Runs FIRST, against the pristine committed lock — the determinism step below
      # overwrites data/methods.lock.json.
      - name: Upstream drift vs the committed lock (informational)
        id: drift
        continue-on-error: true
        run: python -m methods_graph.cli rebuild --check

      - name: Build is deterministic given identical snapshots
        run: |
          set -euo pipefail
          python -m methods_graph.cli rebuild
          cp data/methods.lock.json /tmp/first.lock.json
          python -m methods_graph.cli rebuild
          python - <<'PY'
          import json, sys
          first = json.load(open("/tmp/first.lock.json"))["graph_hash"]
          second = json.load(open("data/methods.lock.json"))["graph_hash"]
          print(f"first rebuild:  {first}")
          print(f"second rebuild: {second}")
          if first != second:
              sys.exit("NON-DETERMINISTIC: two rebuilds from identical snapshots disagree")
          print("deterministic: identical snapshots produce an identical graph hash")
          PY

      - name: Report drift outcome
        env:
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
        run: |
          if [ "$DRIFT_OUTCOME" = "failure" ]; then
            echo "Upstream sources have drifted from the committed lock (expected — the" \
                 "lock's pins are not replayed by \`fetch\`). The build itself is" \
                 "deterministic. See this job's comment block in ci.yml." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No drift: a rebuild reproduces the committed lock exactly." >> "$GITHUB_STEP_SUMMARY"
          fi
